steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: [VITE_GOOGLE_MAPS_KEY]
    args:
      - -c
      - >-
        docker build
        --build-arg VITE_GOOGLE_MAPS_KEY="$$VITE_GOOGLE_MAPS_KEY"
        --tag "${_IMAGE}"
        .
images:
  - "${_IMAGE}"
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/sampaaa-vite-google-maps-key/versions/latest
      env: VITE_GOOGLE_MAPS_KEY
