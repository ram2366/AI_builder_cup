[project]
name = "landlens-api"
version = "0.1.0"
description = "SAMPAAA API: satellite land-history evidence + Gemini investigator agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "google-genai>=2.30.1",
    "google-adk>=2.12.0",
    "python-multipart>=0.0.32",
    "earthengine-api>=1.7.48",
    "google-cloud-firestore>=2.21.0",
    "shapely>=2.1,<3",
    "timezonefinder>=9,<10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
